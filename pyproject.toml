[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translation-pipeline"
version = "5.0.0"
description = "Local and pluggable video/audio transcription and translation pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1,<2",
    "webvtt-py>=0.4,<1",
    "imageio-ffmpeg>=0.6,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
google = [
    "google-auth-oauthlib>=1,<2",
]
rclone = []
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<0.17",
]
package = [
    "pyinstaller>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[project.scripts]
video-translation-pipeline = "main:main"
