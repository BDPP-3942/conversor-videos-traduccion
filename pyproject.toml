[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translation-pipeline"
version = "4.1.0"
description = "Local and pluggable video/audio transcription and translation pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1,<2",
    "deep-translator>=1.11,<2",
    "webvtt-py>=0.4,<1",
    "imageio-ffmpeg>=0.6,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1,<2",
]
rclone = []
dev = [
    "pytest>=8,<9",
    "ruff==0.9.10",
]
package = [
    "pyinstaller>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
required-version = "==0.9.10"
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools]
packages = ["config", "src", "src.storage"]
py-modules = ["main"]

[project.scripts]
video-translation-pipeline = "main:main"
