[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translation-pipeline"
version = "1.5.2"
description = "Local and pluggable video/audio transcription, translation and synchronized TTS pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2.1,<1.3",
    "ctranslate2>=4.8.2,<4.9",
    "sentencepiece>=0.2,<0.3",
    "webvtt-py>=0.4,<1",
    "imageio-ffmpeg>=0.6,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1,<2"]
rclone = []
tts = ["kokoro-onnx>=0.6.1,<0.7"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.9,<0.17"]
package = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["config", "src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/test_reference_naming.py" = ["I001", "E501"]
"tests/test_e2e_release.py" = ["S603"]
"tests/test_run_local_scripts.py" = ["S603"]
"src/naming_policy.py" = ["E501"]
"src/whisper_prompt.py" = ["E501"]
"src/auth/rclone_manager.py" = ["S603", "S310"]
"src/media_identity.py" = ["S603"]
"src/storage/rclone.py" = ["S603"]
"src/translation_providers.py" = ["S310"]
"src/hardware.py" = ["S603"]
"src/local_translation.py" = ["S310"]
"tests/test_media_converter.py" = ["S603"]
"tests/test_media_identity.py" = ["S603"]
"src/reprocessor.py" = ["S101"]
"src/subtitle_qa.py" = ["S310"]

[tool.ruff.format]
exclude = [
    "src/naming_policy.py",
    "tests/test_reference_naming.py",
    "tests/test_e2e_release.py",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[tool.setuptools.package-data]
config = ["*.toml", "palabras_contexto.*"]

[project.scripts]
video-translation-pipeline = "main:main"
video-translation-regenerate = "src.regeneration:main"
video-subtitle-qa = "src.subtitle_qa_cli:main"
video-translation-tts = "src.tts_cli:main"
