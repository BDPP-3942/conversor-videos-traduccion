[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-translation-pipeline"
version = "1.7.4"
description = "Local and pluggable video/audio transcription, translation and synchronized TTS pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2.1,<1.3",
    "ctranslate2>=4.8.2,<4.9",
    "sentencepiece>=0.2,<0.3",
    "huggingface-hub>=0.32,<1.31",
    "webvtt-py>=0.4,<1",
    "imageio-ffmpeg>=0.6,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1,<2"]
rclone = []
tts = ["kokoro-onnx>=0.6.1,<0.7"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.9,<0.17"]
package = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
