name: Format PR

on:
  push:
    branches:
      - feat/resource-manager-performance-20260831

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install "ruff>=0.16,<0.17"
      - name: Format
        run: ruff format .
      - name: Fix safe lint issues
        run: ruff check . --fix
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(ci): format Python sources"
          git push
