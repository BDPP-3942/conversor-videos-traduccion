name: Sync release changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/sync-release-changelog.yml

permissions:
  contents: read

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Validar historial y sección de release 1.10.0
        shell: bash
        run: |
          set -euo pipefail

          # Validar las cabeceras de la release candidata y de su baseline
          # sin acoplar el control a la redacción interna de las entradas.
          for version in 1.10.0 1.9.0 1.8.3 1.8.2 1.8.1 1.8.0; do
            if ! grep -Fq "## [$version]" CHANGELOG.md; then
              echo "Falta la cabecera del CHANGELOG: ## [$version]" >&2
              exit 1
            fi
          done

          # La sección 1.10.0 debe describir únicamente cambios posteriores a
          # v1.9.0; la funcionalidad de escritorio y packaging de v1.9.0 debe
          # permanecer en su propia entrada histórica.
          release_section="$(awk '/^## \[1\.10\.0\]/{flag=1;next}/^## \[1\.9\.0\]/{flag=0}flag' CHANGELOG.md)"
          baseline_section="$(awk '/^## \[1\.9\.0\]/{flag=1;next}/^## \[1\.8\.3\]/{flag=0}flag' CHANGELOG.md)"

          grep -Fq 'Baseline:' <<< "$release_section" || {
            echo 'La sección 1.10.0 debe declarar su baseline.' >&2
            exit 1
          }
          grep -Fq 'v1.9.0' <<< "$release_section" || {
            echo 'La sección 1.10.0 debe identificar v1.9.0 como baseline.' >&2
            exit 1
          }
          grep -Fq 'video-translation-desktop' <<< "$baseline_section" || {
            echo 'La funcionalidad de escritorio debe permanecer documentada en 1.9.0.' >&2
            exit 1
          }
          grep -Fq 'PyInstaller' <<< "$baseline_section" || {
            echo 'El packaging introducido en 1.9.0 debe permanecer en su entrada histórica.' >&2
            exit 1
          }

          for marker in \
            'Reparación conservadora de nombres UTF-8' \
            'Normalización Unicode' \
            'Separación de las carpetas de trabajo' \
            'CLI' \
            'automatización de `uv.lock`' \
            'No se introduce soporte móvil'; do
            if ! grep -Fq "$marker" <<< "$release_section"; then
              echo "Falta el marcador propio de 1.10.0: $marker" >&2
              exit 1
            fi
          done

          echo 'CHANGELOG.md separa correctamente 1.10.0 de la baseline histórica 1.9.0.'
