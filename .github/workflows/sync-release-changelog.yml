name: Sync release changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/sync-release-changelog.yml

permissions:
  contents: read

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Validar sección de release 1.10.0
        shell: bash
        run: |
          set -euo pipefail

          # Validar las cabeceras de release independientemente de la redacción
          # utilizada dentro de cada entrada histórica.
          for version in 1.10.0 1.8.3 1.8.2 1.8.1 1.8.0; do
            if ! grep -Fq "## [$version]" CHANGELOG.md; then
              echo "Falta la cabecera del CHANGELOG: ## [$version]" >&2
              exit 1
            fi
          done

          # Validar conceptos propios de la release sin acoplar el control a
          # una frase exacta que pueda editarse legítimamente.
          for marker in \
            'Windows:' \
            'PyInstaller' \
            'Linux:' \
            'AppImage' \
            'ZIP portable de Windows' \
            'macOS:' \
            'CLI' \
            'unattended/headless' \
            'programada' \
            'No se introduce soporte móvil'; do
            if ! grep -Fq "$marker" CHANGELOG.md; then
              echo "Falta el marcador del CHANGELOG: $marker" >&2
              exit 1
            fi
          done

          echo 'CHANGELOG.md contiene la sección completa de release 1.10.0 y las entradas históricas.'
