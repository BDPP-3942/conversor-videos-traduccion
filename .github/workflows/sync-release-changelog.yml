name: Sync release changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/sync-release-changelog.yml

permissions:
  contents: write

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Synchronize 1.9.0 section
        shell: bash
        run: |
          if grep -q '^## \[1.9.0\]' CHANGELOG.md; then
            echo "1.9.0 changelog section already exists"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          header = """## [1.9.0] — Desktop Application & Native Packaging

          **Tipo:** MINOR — release candidata.

          **Estado:** CANDIDATA — pendiente de CI, Release Gate, merge a `main` y publicación de `v1.9.0`.

          **Baseline:** `v1.8.2` publicada.

          ### Added

          - Nueva aplicación GUI multiplataforma mediante `video-translation-desktop`.
          - Fachada `VideoTranslationApplication` y adaptador `ControllableMediaPipeline` sobre el pipeline existente.
          - Eventos de etapa, progreso y cancelación cooperativa en límites seguros.
          - GUI para procesamiento, recuperación de subtítulos, duplicados y diagnósticos.
          - Configuración de almacenamiento, idiomas, proveedores/fallbacks, concurrencia, Whisper, WebM, TTS, resume y naming.
          - Recuperación `full`, `stt_only` y `translate_only` y deduplicación con scan/análisis/dry-run/eliminación confirmada.

          ### Packaging

          - Windows: PyInstaller `.exe` y MSI WiX 6.
          - macOS: bundle `.app` archivado como `.zip`.
          - Linux: bundle PyInstaller + AppDir + AppImage x86_64.
          - Validación nativa en Linux, Windows y macOS.

          ### Release automation

          - Los tags `vX.Y.Z` activan el workflow de release.
          - Los runners nativos construyen los artefactos de cada sistema.
          - AppImage, MSI, ZIP portable de Windows y ZIP de macOS se adjuntan automáticamente a la GitHub Release junto con los archivos fuente generados por GitHub.
          - Se elimina la necesidad de build y upload manual en cada release.

          ### Compatibility

          - CLI, ejecución programada/headless, regeneración, subtitle-QA y TTS permanecen soportados.
          - No se introduce soporte móvil.

          ### Validation

          - Matriz Linux/Windows/macOS con Python 3.11, 3.12 y 3.13.
          - Tests, Ruff, compileall, `uv lock --check`, `uv sync --locked`, packaging y Release Gate.
          - Smoke validation de los artefactos nativos de escritorio.

          """
          path.write_text(header + path.read_text(encoding="utf-8"), encoding="utf-8")
          PY
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add 1.9.0 desktop changelog"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
