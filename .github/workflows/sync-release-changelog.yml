name: Sync release changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/sync-release-changelog.yml

permissions:
  contents: read

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Validate 1.9.0 release section
        shell: bash
        run: |
          grep -q '^## \[1.9.0\]' CHANGELOG.md
          grep -q '## \[1.8.3\]' CHANGELOG.md
          grep -q '## \[1.8.2\]' CHANGELOG.md
          grep -q '## \[1.8.1\]' CHANGELOG.md
          grep -q '## \[1.8.0\]' CHANGELOG.md
          grep -q 'Windows: ejecutable GUI PyInstaller' CHANGELOG.md
          grep -q 'Linux: la misma GUI PyInstaller' CHANGELOG.md
          grep -q 'AppImage' CHANGELOG.md
          grep -q 'ZIP portable de Windows' CHANGELOG.md
          grep -q 'CLI, ejecución programada/headless' CHANGELOG.md
          echo 'CHANGELOG.md contains the complete 1.9.0 release section and historical entries.'
