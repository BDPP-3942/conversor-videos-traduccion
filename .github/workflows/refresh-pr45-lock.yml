name: Refresh PR45 uv lock

on:
  push:
    branches: [feat/macos-whisper-local-translation]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/macos-whisper-local-translation
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
      - run: uv python install 3.13
      - run: uv lock
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh uv lock for 1.8.0"
          git push origin HEAD:feat/macos-whisper-local-translation
