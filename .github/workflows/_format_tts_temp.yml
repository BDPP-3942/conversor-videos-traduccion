name: Temporary Ruff formatter

on:
  push:
    branches:
      - feat/tts-sync-media-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Ruff used by CI
        run: python -m pip install 'ruff==0.16.5'
      - name: Format changed files and commit
        shell: bash
        run: |
          set -euo pipefail
          ruff format config/loader.py src/storage/tts.py src/tts_cli.py src/tts_pipeline.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/loader.py src/storage/tts.py src/tts_cli.py src/tts_pipeline.py
          git rm -f .github/workflows/_format_tts_temp.yml
          git commit -m 'style: apply canonical Ruff formatting'
          git push origin HEAD:feat/tts-sync-media-audit
