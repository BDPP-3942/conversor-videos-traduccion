name: Sync uv lockfile

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/uv-lock-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: uv-lock-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true

      - run: uv python install 3.13
      - run: uv lock

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: sync uv lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
