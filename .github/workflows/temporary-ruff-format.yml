name: Temporary Ruff format fix

on:
  push:
    branches:
      - feat/desktop-gui-installer-and-zip-unicode

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run ruff format .
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-ruff-format.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: aplicar formato Ruff pendiente"
          git push
