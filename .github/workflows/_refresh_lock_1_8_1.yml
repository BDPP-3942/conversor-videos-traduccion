name: Refresh 1.8.1 lockfile

on:
  push:
    branches:
      - feat/release-1.8.1-local-uv-bootstrap

permissions:
  contents: read

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/feat/release-1.8.1-local-uv-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: latest-known
      - run: uv lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-1.8.1
          path: uv.lock
          if-no-files-found: error
