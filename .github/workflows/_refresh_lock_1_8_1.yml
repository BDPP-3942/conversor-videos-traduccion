name: Refresh 1.8.1 lockfile

on:
  push:
    branches:
      - feat/release-1.8.1-local-uv-bootstrap

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/feat/release-1.8.1-local-uv-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: latest-known
      - run: uv lock
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git add uv.lock
          git commit -m "chore(release): synchronize uv lockfile for 1.8.1"
          git push origin HEAD:${GITHUB_REF_NAME}
