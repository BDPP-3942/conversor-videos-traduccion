name: Formato Python

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar código de la rama de la PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - name: Preparar entorno de desarrollo para Ruff
        run: |
          uv python install 3.13
          uv sync --group dev
      - name: Aplicar formato Ruff a todo el código Python
        run: uv run ruff format .
      - name: Crear y fusionar PR auxiliar de formato
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTOMATION_BRANCH: automation/ruff-format-58
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.py'; then
            echo 'No hay cambios de formato pendientes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$AUTOMATION_BRANCH" "$TARGET_BRANCH"
          git checkout -B "$AUTOMATION_BRANCH" "origin/$TARGET_BRANCH"
          git add -- '*.py'
          git commit -m 'style: aplicar formato Ruff'
          git push --force-with-lease origin "$AUTOMATION_BRANCH"
          pr_url="$(gh pr list --repo "$REPOSITORY" --base "$TARGET_BRANCH" --head "$AUTOMATION_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create --repo "$REPOSITORY" --base "$TARGET_BRANCH" --head "$AUTOMATION_BRANCH" --title 'style: aplicar formato Ruff' --body "PR auxiliar generada automáticamente para aplicar el formato Ruff a la PR principal #${PR_NUMBER}. No modifica lógica funcional.")"
          fi
          gh pr merge "$pr_url" --repo "$REPOSITORY" --squash

      - name: Verificar que el formato aplicado es estable
        run: uv run ruff format --check .
