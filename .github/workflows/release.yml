name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONWARNINGS: default

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-appimage
            format: linux-appimage
          - os: windows-latest
            artifact: windows-msi
            format: windows-msi
          - os: macos-latest
            artifact: macos-app
            format: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install WiX v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build desktop package
        shell: bash
        run: uv run python scripts/build_desktop.py --clean --version "${{ steps.version.outputs.version }}" --format ${{ matrix.format }}
      - name: Validate macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: test -d dist/VideoTranslationPipeline.app
      - name: Validate Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: test -f "dist/VideoTranslationPipeline-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
      - name: Validate Windows executable and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\VideoTranslationPipeline\VideoTranslationPipeline.exe')) { throw 'Missing Windows executable' }
          if (-not (Test-Path "dist\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x64.msi")) { throw 'Missing Windows MSI' }
      - name: Archive Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\VideoTranslationPipeline\*' -DestinationPath "dist\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x64-portable.zip" -Force
      - name: Archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VideoTranslationPipeline.app "dist/VideoTranslationPipeline-${{ steps.version.outputs.version }}-macos.app.zip"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/VideoTranslationPipeline-*.AppImage
            dist/VideoTranslationPipeline-*.msi
            dist/VideoTranslationPipeline-*.app.zip
            dist/VideoTranslationPipeline-*-portable.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release and attach desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --title "$TAG"
          fi
