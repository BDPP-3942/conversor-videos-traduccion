name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release existente que se debe construir y publicar"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONWARNINGS: default

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-appimage
            format: linux-appimage
            arch: x64
            python: "3.13"
          - os: windows-latest
            artifact: windows-msi-x64
            format: windows-msi
            arch: x64
            python: "3.13"
          - os: macos-latest
            artifact: macos-app
            format: native
            arch: x64
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install WiX v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build desktop package
        shell: bash
        run: uv run python scripts/build_desktop.py --clean --version "${{ steps.version.outputs.version }}" --format ${{ matrix.format }} --windows-arch ${{ matrix.arch }}
      - name: Validate macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: test -d dist/VideoTranslationPipeline.app
      - name: Validate Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: test -f "dist/VideoTranslationPipeline-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
      - name: Validate Windows executable and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\VideoTranslationPipeline\VideoTranslationPipeline.exe')) { throw 'Falta el ejecutable de Windows' }
          if (-not (Test-Path "dist\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x64.msi")) { throw 'Falta el MSI de Windows x64' }
      - name: Archive Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\VideoTranslationPipeline\*' -DestinationPath "dist\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x64-portable.zip" -Force
      - name: Archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/VideoTranslationPipeline.app "dist/VideoTranslationPipeline-${{ steps.version.outputs.version }}-macos.app.zip"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/VideoTranslationPipeline-*.AppImage
            dist/VideoTranslationPipeline-*.msi
            dist/VideoTranslationPipeline-*.app.zip
            dist/VideoTranslationPipeline-*-portable.zip
          if-no-files-found: error

  build-windows-x86:
    name: Build windows-msi-x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          architecture: x86
      - name: Install WiX v6
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Install x86 runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-x86.txt
          python -m pip install --no-deps .
      - name: Validate x86 interpreter and dependencies
        shell: pwsh
        run: |
          python -c "import struct, sys, vosk; assert struct.calcsize('P') * 8 == 32; print(sys.version)"
          python -m compileall src config main.py
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          "version=$($tag -replace '^v','')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build x86 desktop package
        shell: pwsh
        run: python scripts/build_desktop.py --clean --version "${{ steps.version.outputs.version }}" --format windows-msi --windows-arch x86
      - name: Validate x86 executable y MSI
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\\VideoTranslationPipeline\\VideoTranslationPipeline.exe')) { throw 'Falta el ejecutable de Windows x86' }
          if (-not (Test-Path "dist\\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x86.msi")) { throw 'Falta el MSI de Windows x86' }
      - name: Archive Windows x86 portable executable
        shell: pwsh
        run: Compress-Archive -Path 'dist\VideoTranslationPipeline\*' -DestinationPath "dist\VideoTranslationPipeline-${{ steps.version.outputs.version }}-windows-x86-portable.zip" -Force
      - name: Upload x86 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86
          path: |
            dist/VideoTranslationPipeline-*.msi
            dist/VideoTranslationPipeline-*-portable.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-windows-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify Git repository context
        shell: bash
        run: |
          git rev-parse --show-toplevel
          git rev-parse --verify "refs/tags/${TAG}" >/dev/null
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Publish release and attach desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No se han encontrado artefactos de release" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --title "$TAG"
          fi
