name: Format branch once

on:
  push:
    branches:
      - feat/provider-quotas-naming-raw-video

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.4"

      - name: Apply Ruff formatting
        run: ruff format .

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format code with Ruff"
          git push origin HEAD:${GITHUB_REF_NAME}
