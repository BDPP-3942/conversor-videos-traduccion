name: Desktop packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: "1.10.0"

jobs:
  desktop:
    name: ${{ matrix.os }} ${{ matrix.arch }} desktop artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: linux-appimage
            artifact: linux-appimage
            arch: x64
            python: "3.13"
          - os: windows-latest
            format: windows-msi
            artifact: windows-msi-x64
            arch: x64
            python: "3.13"
          - os: windows-latest
            format: windows-msi
            artifact: windows-msi-x86
            arch: x86
            python: "3.13-windows-x86"
          - os: macos-latest
            format: native
            artifact: macos-app
            arch: x64
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv lock --check
      - name: Sync locked desktop environment
        env:
          PYTHONWARNINGS: default
        run: uv sync --locked --group dev
      - name: Install WiX v6
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build native desktop artifact
        shell: bash
        run: uv run python scripts/build_desktop.py --clean --version "$RELEASE_VERSION" --format ${{ matrix.format }} --windows-arch ${{ matrix.arch }}
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: test -d dist/VideoTranslationPipeline.app
      - name: Validate Windows executable and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\VideoTranslationPipeline\VideoTranslationPipeline.exe')) { exit 1 }
          if (-not (Test-Path "dist\VideoTranslationPipeline-$env:RELEASE_VERSION-windows-${{ matrix.arch }}.msi")) { exit 1 }
      - name: Validate Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: test -f "dist/VideoTranslationPipeline-$RELEASE_VERSION-linux-x86_64.AppImage"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-translation-${{ matrix.artifact }}
          path: |
            dist/VideoTranslationPipeline.app
            dist/VideoTranslationPipeline/**
            dist/VideoTranslationPipeline-*.msi
            dist/VideoTranslationPipeline-*.AppImage
          if-no-files-found: error
