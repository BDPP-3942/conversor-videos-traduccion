name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Candidate SemVer"
        required: true

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync locked release environment
        env:
          PYTHONWARNINGS: default
        run: uv sync --locked --group dev
      - name: Verify release metadata and repository invariants
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_version || '' }}
          REQUIRE_TAG_ABSENT: ${{ github.event_name == 'workflow_dispatch' }}
        run: uv run python scripts/release_gate.py "$EXPECTED_SHA" "$EXPECTED_VERSION" "$REQUIRE_TAG_ABSENT"
      - name: Build distributions
        run: uv build
      - name: Verify packaged resources and entry points
        run: uv run pytest -q tests/test_packaging.py
      - name: Verify clean wheel installation with pip
        env:
          # pip/setuptools can emit deprecation warnings from their own internals;
          # those warnings must not invalidate the compatibility gate.
          PYTHONWARNINGS: default
        run: |
          python -m venv /tmp/release-gate-venv
          /tmp/release-gate-venv/bin/python -m pip install --upgrade pip
          /tmp/release-gate-venv/bin/python -m pip install dist/*.whl
          /tmp/release-gate-venv/bin/python -m pip check
          /tmp/release-gate-venv/bin/video-translation-pipeline --help
          /tmp/release-gate-venv/bin/video-translation-regenerate --help
          /tmp/release-gate-venv/bin/video-subtitle-qa --help
          /tmp/release-gate-venv/bin/video-translation-tts --help
      - name: Verify source package compiles
        run: uv run python -m compileall .
