name: CI

# Validate the actual branch head so PR evidence is reproducible and tied to the submitted SHA.
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches: [main]

permissions:
  contents: read

# Avoid wasting private-repository Actions minutes when a newer commit supersedes an older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONWARNINGS: error
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    strategy:
      # Cancel the remaining matrix jobs after the first failure; the same final SHA can be rerun after the fix.
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install project with CI dependencies
        run: python -m pip install ".[dev,google]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests excluding wheel-only checks
        run: python -m pytest -q --ignore=tests/test_packaging.py
      - name: Verify installed entry points
        run: |
          video-translation-pipeline --help
          video-translation-regenerate --help
          video-subtitle-qa --help
          video-translation-tts --help
      - name: Verify Windows local wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv --system-site-packages .venv
          cmd /c "scripts\run_local.bat regenerate --help"
      - name: Verify POSIX local wrapper syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/run_local.sh
          bash -n scripts/run_unattended.sh
          bash -n scripts/run_scheduled.sh
      - name: Verify imports and unused imports
        run: ruff check . --select F401,I001
      - name: Ruff lint
        run: ruff check .
      - name: Ruff security rules
        run: ruff check . --select S
      - name: Ruff format check
        run: ruff format --check .
      - name: Python compile check
        run: python -m compileall .

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Build distributions
        run: python -m build
      - name: Install project test tooling
        run: python -m pip install ".[dev]"
      - name: Verify wheel contents
        run: python -m pytest -q tests/test_packaging.py
      - name: Install wheel into clean target
        run: |
          python -m venv /tmp/package-check
          /tmp/package-check/bin/python -m pip install --upgrade pip
          /tmp/package-check/bin/python -m pip install dist/*.whl
          /tmp/package-check/bin/python -m pip check
          /tmp/package-check/bin/video-translation-pipeline --help
          /tmp/package-check/bin/video-translation-regenerate --help
          /tmp/package-check/bin/video-subtitle-qa --help
          /tmp/package-check/bin/video-translation-tts --help

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install project with CI dependencies and audit tooling
        run: python -m pip install ".[dev,google]" pip-audit
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Remove local project before PyPI vulnerability audit
        run: python -m pip uninstall -y video-translation-pipeline
      - name: Audit dependencies
        env:
          PYTHONWARNINGS: default
        run: python -m pip_audit --strict

  tts-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install optional TTS dependencies and audit tooling
        run: python -m pip install ".[tts]" pip-audit
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Remove local project before PyPI vulnerability audit
        run: python -m pip uninstall -y video-translation-pipeline
      - name: Audit TTS dependency graph
        env:
          PYTHONWARNINGS: default
        run: python -m pip_audit --strict
