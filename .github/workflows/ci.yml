name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONWARNINGS: error

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project with CI dependencies
        run: python -m pip install ".[dev,google]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Verify installed entry points
        run: |
          video-translation-pipeline --help
          video-translation-regenerate --help
          video-subtitle-qa --help
          video-translation-tts --help

      - name: Verify imports and unused imports
        run: ruff check . --select F401,I001

      - name: Ruff lint
        run: ruff check .

      - name: Ruff security rules
        run: ruff check . --select S

      - name: Ruff format check
        run: ruff format --check .

      - name: Python compile check
        run: python -m compileall -q config src main.py process_raw_videos.py process_videos.py

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build distributions
        run: python -m build

      - name: Install wheel into clean target
        run: |
          python -m venv /tmp/package-check
          /tmp/package-check/bin/python -m pip install --upgrade pip
          /tmp/package-check/bin/python -m pip install dist/*.whl
          /tmp/package-check/bin/python -m pip check
          /tmp/package-check/bin/video-translation-pipeline --help
          /tmp/package-check/bin/video-translation-regenerate --help
          /tmp/package-check/bin/video-subtitle-qa --help
          /tmp/package-check/bin/video-translation-tts --help

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project with CI dependencies and audit tooling
        run: python -m pip install ".[dev,google]" pip-audit

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Remove local project before PyPI vulnerability audit
        run: python -m pip uninstall -y video-translation-pipeline

      - name: Audit dependencies
        env:
          PYTHONWARNINGS: default
        run: pip-audit --strict

  tts-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install optional TTS dependencies and audit tooling
        run: python -m pip install ".[tts]" pip-audit

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Remove local project before PyPI vulnerability audit
        run: python -m pip uninstall -y video-translation-pipeline

      - name: Audit TTS dependency graph
        env:
          PYTHONWARNINGS: default
        run: pip-audit --strict
