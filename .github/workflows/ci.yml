name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Quality / uv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked --extra google --group dev
      - run: uv run pip check
      - run: uv run ruff check . --select F401,I001
      - run: uv run ruff check .
      - run: uv run ruff check . --select S
      - run: uv run ruff format --check .
      - run: uv run python -m compileall .

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --extra google --group dev
      - run: uv run pip check
      - run: uv run pytest -q --ignore=tests/test_packaging.py
      - name: Verify installed entry points
        run: |
          uv run video-translation-pipeline --help
          uv run video-translation-regenerate --help
          uv run video-subtitle-qa --help
          uv run video-translation-tts --help
      - name: Verify local wrapper syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/run_local.sh
          bash -n scripts/run_unattended.sh
          bash -n scripts/run_scheduled.sh
      - name: Verify Windows local wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmd /c "scripts\run_local.bat regenerate --help"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run pytest -q tests/test_packaging.py
      - run: uv build
      - name: Install wheel with pip compatibility gate
        run: |
          python -m venv /tmp/package-check
          /tmp/package-check/bin/python -m pip install --upgrade pip
          /tmp/package-check/bin/python -m pip install dist/*.whl
          /tmp/package-check/bin/python -m pip check
          /tmp/package-check/bin/video-translation-pipeline --help
          /tmp/package-check/bin/video-translation-regenerate --help
          /tmp/package-check/bin/video-subtitle-qa --help
          /tmp/package-check/bin/video-translation-tts --help

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked --extra google --group dev --group audit
      - run: uv run pip check
      - run: uv run pip-audit --strict

  tts-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked --extra tts --group audit
      - run: uv run pip check
      - run: uv run pip-audit --strict
