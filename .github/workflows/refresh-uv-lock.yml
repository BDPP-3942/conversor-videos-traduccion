name: Refresh release metadata

on:
  push:
    branches: [feat/desktop-app]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/refresh-uv-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - name: Refresh lockfile
        run: uv lock
      - name: Synchronize changelog header
        shell: bash
        run: |
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          if [ "$version" != "1.9.0" ]; then
            echo "This branch workflow only synchronizes the 1.9.0 desktop candidate"
            exit 0
          fi
          if grep -q '^## \[1.9.0\]' CHANGELOG.md; then
            echo "CHANGELOG already contains 1.9.0"
            exit 0
          fi
          tmp="CHANGELOG.md.tmp"
          cat > "$tmp" <<'EOF'
          ## [1.9.0] — Desktop Application & Native Packaging

          **Tipo:** MINOR — release candidata.

          **Estado:** CANDIDATA — pendiente de CI, Release Gate, merge a `main` y publicación de `v1.9.0`.

          **Baseline:** `v1.8.2` publicada. El trabajo histórico de resolución de uv de `1.8.3` se conserva en la documentación de release y no se elimina.

          ### Added

          - Nueva aplicación GUI multiplataforma mediante `video-translation-desktop`.
          - Fachada `VideoTranslationApplication` para desacoplar la UI del pipeline.
          - `ControllableMediaPipeline` sobre el pipeline existente para eventos de etapa, progreso y cancelación cooperativa segura.
          - Pestañas de procesamiento, recuperación de subtítulos, duplicados, diagnósticos y CLI/scheduling.
          - Configuración GUI de proveedores de almacenamiento, idiomas, traducción, fallback, concurrencia, Whisper, WebM, TTS, resume y naming.
          - Recuperación `full`, `stt_only` y `translate_only`.
          - Scan, análisis, dry-run y eliminación confirmada de duplicados.

          ### Packaging

          - Windows: ejecutable PyInstaller `.exe` y MSI WiX 6.
          - macOS: bundle `.app` archivado automáticamente como `.zip`.
          - Linux: ejecutable PyInstaller envuelto en AppDir y distribuido como AppImage x86_64.
          - Validación nativa de los tres formatos en GitHub Actions.

          ### Release automation

          - Los tags `vX.Y.Z` activan el workflow de release.
          - Los runners nativos construyen los artefactos para cada sistema operativo.
          - Los binarios se adjuntan automáticamente a la GitHub Release junto a los archivos fuente que GitHub genera para el tag.
          - Se elimina la necesidad de compilar y subir manualmente los binarios en cada release.

          ### Compatibility

          - CLI, ejecución programada/headless, regeneración, subtitle-QA y TTS permanecen soportados.
          - No se introduce soporte móvil.

          ### Validation

          - Matriz Linux/Windows/macOS con Python 3.11, 3.12 y 3.13.
          - Tests, Ruff, compileall, `uv lock --check`, `uv sync --locked`, packaging y Release Gate.
          - Smoke validation de los artefactos nativos de escritorio.

          EOF
          cat CHANGELOG.md >> "$tmp"
          mv "$tmp" CHANGELOG.md
      - name: Commit synchronized release metadata
        run: |
          if git diff --quiet -- uv.lock CHANGELOG.md; then
            echo "Release metadata is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock CHANGELOG.md
          git commit -m "chore: synchronize 1.9.0 release metadata"
          git push
